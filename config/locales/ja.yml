ja:
  # 1. Rails標準のバリデーションエラーとモデル名の日本語化
  activerecord:
    errors:
      messages:
        blank: "を入力してください"
        taken: "はすでに使用されています"
    models:
      pet: "ペット"
      group: "グループ"
      user: "ユーザー"
    attributes:
      pet:
        name: "ペットの名前"
        species: "種類"
        age: "年齢"
        gender: "性別"
      group:
        name: "グループ名"
      user:
        name: "名前"
        email: "メールアドレス"
        password: "パスワード"
        password_confirmation: "パスワード（確認用）"

  # 2. ペットの性別（Enum）の日本語化
  enums:
    pet:
      gender:
        unknown: "不明"
        male: "男の子（オス）"
        female: "女の子（メス）"

  # 3. カレンダー（simple_calendar）の日本語化
  simple_calendar:
    previous: "◀"
    next: "▶"

  # 4. 日付・時刻の日本語フォーマット
  date:
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
    day_names: [日曜日, 月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日]
    abbr_month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    order:
      - :year
      - :month
      - :day

  time:
    formats:
      default: "%Y年%m月%d日 %H:%M"
      long: "%Y年%m月%d日 %H時%m分"
      short: "%m/%d %H:%M"