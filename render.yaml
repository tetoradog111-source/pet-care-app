services:
  - type: web
    name: pet-care-sharing-app
    plan: free  # ← これを追加
    env: ruby
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pet-care-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: pet-care-db
    plan: free  # ← データベースも free に設定
    databaseName: pet_care_sharing_app
    user: mako